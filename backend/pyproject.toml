[project]
name = "voicestack"
version = "0.1.0"
description = "Open-source voice agent builder on xAI's speech-to-speech API, built with LangGraph and LangChain"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "asyncpg>=0.32.0",
    "beautifulsoup4>=4.15.0",
    "cryptography>=50.0.2",
    "docx2txt>=0.9",
    "fastapi>=0.143.0",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "jsonpath-ng>=1.10.0",
    "langchain-core>=1.6.9",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.0",
    "langchain-text-splitters>=1.1.3",
    "langchain-xai>=1.3.0",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "numpy>=2.5.4",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.20.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
    "websockets>=16.1.1",
]

[project.scripts]
voicestack = "voicestack.cli:app"

[project.entry-points."voicestack.tools"]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["tests"]
timeout = 120
testpaths = ["tests"]
markers = ["live: needs XAI_API_KEY and calls the real xAI API"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["voicestack", "conftest"]
