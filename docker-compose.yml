# Local or single-VM deployment: Voice Stack + Postgres.
#   cp .env.example .env    # set APP_ENCRYPTION_KEY at minimum
#   docker compose up --build
services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://voicestack:voicestack@db:5432/voicestack
      APP_ENV: ${APP_ENV:-production}
      PORT: "8000"
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - appdata:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: voicestack
      POSTGRES_PASSWORD: voicestack
      POSTGRES_DB: voicestack
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicestack"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  appdata:
  pgdata:
