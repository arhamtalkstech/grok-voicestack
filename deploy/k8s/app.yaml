apiVersion: apps/v1
kind: Deployment
metadata:
  name: voicestack-app
  labels: {app: voicestack, role: app}
spec:
  replicas: 2
  selector:
    matchLabels: {app: voicestack, role: app}
  template:
    metadata:
      labels: {app: voicestack, role: app}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      terminationGracePeriodSeconds: 120
      containers:
        - name: voicestack
          image: voicestack:latest
          ports: [{containerPort: 8000, name: http}]
          env:
            - {name: ROLE, value: app}
          envFrom:
            - configMapRef: {name: voicestack}
            - secretRef: {name: voicestack}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {memory: 2Gi}
          volumeMounts:
            - {name: data, mountPath: /app/data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: voicestack-app
spec:
  selector: {app: voicestack, role: app}
  ports: [{port: 80, targetPort: http, name: http}]
  sessionAffinity: ClientIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: voicestack-app
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: voicestack-app}
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
